# Integration databases for sqladapter live smoke (do not use in production).
# Host ports avoid common local collisions (e.g. host Postgres on 5433).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nitro
      POSTGRES_DB: nitro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nitro"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: nitro
      MYSQL_DATABASE: nitro
      MYSQL_USER: user
      MYSQL_PASSWORD: nitro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnitro"]
      interval: 3s
      timeout: 5s
      retries: 40

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: nitro
      MYSQL_DATABASE: nitro
      MYSQL_USER: user
      MYSQL_PASSWORD: nitro
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Nitro_Str0ng!"
    ports:
      - "127.0.0.1:1434:1433"
    # The image has no "create database" env var: the healthcheck creates `nitro`
    # idempotently, so `up --wait` only returns once the database exists.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          Q="IF DB_ID('nitro') IS NULL CREATE DATABASE nitro; SELECT 1";
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Nitro_Str0ng!' -C -b -Q "$$Q" ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Nitro_Str0ng!' -b -Q "$$Q"
      interval: 5s
      timeout: 10s
      retries: 40
