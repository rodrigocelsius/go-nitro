name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discover every Go module in the repo (nested modules: `go test ./...` at
  # the root does not cover them).
  modules:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          # Exclude the umbrella root go.mod (no packages; go test ./... exits 1).
          list=$(find . -name go.mod -not -path './examples/*' -not -path '*/testdata/*' -not -path '*/routetestdata*' -not -path '*/proto_nested/*' \
            -printf '%h\n' | sed 's|^\./||' | grep -vx '\.' | sort | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  test:
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test (race)
        working-directory: ${{ matrix.module }}
        # cmd/nitrogen includes the CLI e2e (new → install → make:scaffold ×3 →
        # go build/vet/test of the generated app).
        run: go test -race -count=1 -shuffle=on ./...

  # Examples are the canonical copy-paste source: each must stay tidy, build,
  # vet and pass its tests against the framework at this commit.
  examples-list:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          list=$(find examples -name go.mod -printf '%h\n' | sort | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  examples:
    needs: examples-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.examples-list.outputs.list) }}
    env:
      NITRO_OTEL: "0"
      NITRO_DB_QUIET: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.example }}/go.mod
          cache-dependency-path: ${{ matrix.example }}/go.sum
      - name: go.mod is tidy
        working-directory: ${{ matrix.example }}
        run: go mod tidy -diff
      - name: vet
        working-directory: ${{ matrix.example }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.example }}
        run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; exit 1; fi

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (all modules)
        run: |
          # Same exclusions as `modules`: fixtures are parsed as AST, not built.
          for m in $(find . -name go.mod -not -path './examples/*' -not -path '*/testdata/*' -not -path '*/routetestdata*' -not -path '*/proto_nested/*' \
            -printf '%h\n' | sed 's|^\./||' | grep -vx '\.'); do
            echo "== $m"; (cd "$m" && govulncheck ./...) || exit 1
          done

  # Real databases: Postgres, MySQL, MariaDB, SQL Server (SQLite runs in-process).
  # NITRO_SQL_REQUIRE=1 turns "database unreachable" into a failure instead of a skip.
  sql-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: data/adapter/sql/go.mod
          cache-dependency-path: data/adapter/sql/go.sum
      - name: start databases
        run: docker compose -f data/adapter/sql/testdata/docker-compose.yml up -d --wait
      - name: integration tests
        working-directory: data/adapter/sql
        env:
          NITRO_SQL_INTEGRATION: "1"
          NITRO_SQL_REQUIRE: "1"
        run: go test -tags=integration -count=1 -run TestLiveDrivers ./...
      - name: stop databases
        if: always()
        run: docker compose -f data/adapter/sql/testdata/docker-compose.yml down -v

  # Real brokers for the NATS / Kafka queue adapters and nitro.QueueFromEnv.
  brokers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
      - name: start brokers
        run: docker compose -f adapters/kafka/testdata/docker-compose.yml up -d --wait
      - name: kafka adapter
        working-directory: adapters/kafka
        env:
          KAFKA_TEST_BROKERS: localhost:9092
        run: go test -race -count=1 ./...
      - name: QueueFromEnv end to end
        working-directory: pkg
        env:
          NITRO_QUEUE_E2E_NATS: nats://localhost:4222
          NITRO_QUEUE_E2E_KAFKA: localhost:9092
        run: go test -count=1 -run TestQueueFromEnv_BrokersE2E .
      - name: stop brokers
        if: always()
        run: docker compose -f adapters/kafka/testdata/docker-compose.yml down -v

  # Short fuzz smoke on the request-facing parsers.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: fuzz (30s per target)
        run: |
          for m in $(grep -rl --include=*_test.go 'func Fuzz' . | xargs -n1 dirname | sort -u); do
            for f in $(grep -h --include=*_test.go -o 'func Fuzz[A-Za-z0-9_]*' $m/*_test.go | awk '{print $2}'); do
              echo "== $m $f"; (cd $m && go test -run '^$' -fuzz "^$f\$" -fuzztime 30s .) || exit 1
            done
          done
