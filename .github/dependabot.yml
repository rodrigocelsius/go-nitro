version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directories:
      - "/pkg"
      - "/domain"
      - "/usecases"
      - "/adapters/*"
      - "/adapters/auth/*"
      - "/blinq"
      - "/data/*"
      - "/data/adapter/*"
      - "/cmd/nitrogen"
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
